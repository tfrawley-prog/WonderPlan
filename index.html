<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WonderPlan</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0B2545">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WonderPlan">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=1191">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=1191">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=1191">

<style>
:root{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --panel2:#f9fafb;
  --ink:#101828;
  --muted:#667085;
  --line:#e4e7ec;
  --accent:#111827;
  --accentSoft:#eef2f7;
  --green:#0f766e;
  --danger:#b42318;
  --shadow:0 8px 28px rgba(16,24,40,.07);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;padding:14px;transition:grid-template-columns .2s ease}.app.plannerHidden{grid-template-columns:72px minmax(0,1fr)}
.sidebar,.main{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.sidebar{padding:18px;display:flex;flex-direction:column;min-height:calc(100vh - 28px)}
.sidebar.collapsed{padding:12px;overflow:hidden}
.sidebar.collapsed .hideWhenCollapsed{display:none}
.sidebar.collapsed .collapseText{display:none}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px}
.brand{font-size:24px;font-weight:800;letter-spacing:-.04em}
.version{font-size:11px;padding:6px 8px;border-radius:999px;background:var(--accentSoft);color:var(--muted);font-weight:700}
.iconBtn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:10px 12px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.iconBtn:hover{background:var(--panel2)}
.sidebarToggle{width:100%;justify-content:center;margin-bottom:18px}
.kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--green);font-weight:800;margin-bottom:8px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.04em;margin:0 0 8px}
.sub{margin:0 0 18px;color:var(--muted);line-height:1.5}
.typeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.typeCard{border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px;text-align:left;min-height:108px;color:var(--ink)}
.typeCard:hover{border-color:#cfd4dc;background:#fbfcfd}
.typeIcon{font-size:24px;margin-bottom:12px}
.typeTitle{font-weight:800;font-size:15px}
.typeDesc{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.formBlock{margin-top:4px}
label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px;color:#344054}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#98a2b3;box-shadow:0 0 0 3px #f2f4f7}
textarea{min-height:90px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;margin-top:18px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:800}
.btn.primary{background:var(--accent);color:#fff;flex:1}
.btn.secondary{background:#f2f4f7;color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;color:var(--ink)}
.chip:hover{background:#f8fafc}
.sidebarFooter{margin-top:auto;padding-top:18px}
.saveRow{display:flex;gap:8px;flex-wrap:wrap}
.saveRow .iconBtn{flex:1;justify-content:center}
.status{font-size:11px;color:var(--green);font-weight:700;margin-top:8px}
.main{padding:18px;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:14px}
.titleWrap h2{margin:0;font-size:26px;letter-spacing:-.04em}
.titleWrap p{margin:4px 0 0;color:var(--muted)}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.segment{display:flex;gap:4px;background:#f2f4f7;padding:4px;border-radius:12px}
.segment button{border:0;background:transparent;color:#475467;border-radius:9px;padding:8px 10px;font-weight:800}
.segment button.active{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.navrow{display:flex;gap:6px}
.navrow button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 10px;font-weight:800}
.calendarScroller{overflow:auto;max-height:calc(100vh - 140px);padding-bottom:4px}
.calendar{display:grid;gap:8px;min-width:850px}
.dayCell{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;min-height:140px}
.dayCell.faded{opacity:.42}
.dayCell.expanded{min-height:300px}
.dayHeader{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f0f2f5;padding-bottom:8px;margin-bottom:8px}
.dayName{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.dayNum{font-size:18px;font-weight:800}
.event{border:1px solid #eceff3;background:#f8fafc;border-radius:10px;padding:8px;margin-bottom:6px;cursor:pointer}
.event:hover{border-color:#cfd4dc}
.event.compact{padding:7px}
.event.compact .eventMeta{display:none}
.event.compact .eventTitle{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eventTime{font-size:10px;color:var(--muted);font-weight:800}
.eventTitle{font-size:12px;font-weight:800;margin-top:2px}
.eventMeta{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35}
.empty{font-size:11px;color:#98a2b3;text-align:center;padding:16px 0}
.yearGrid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:10px;min-width:760px}
.yearMonth{border:1px solid var(--line);border-radius:14px;padding:12px;background:#fff}
.yearMonth h3{margin:0 0 8px;font-size:15px}
.modal{position:fixed;inset:0;background:rgba(16,24,40,.38);display:none;place-items:center;padding:18px;z-index:220}
.modal.open{display:grid}
.modalCard{width:min(520px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 24px 70px rgba(16,24,40,.22)}
.modalTop{display:flex;justify-content:space-between;gap:12px}
.modalTop h3{margin:0;font-size:22px}
.modalClose{border:0;background:#f2f4f7;border-radius:10px;width:36px;height:36px}
.detailGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.detail{background:#f8fafc;border-radius:12px;padding:11px}
.detail small{display:block;color:var(--muted);margin-bottom:4px}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{min-height:auto}
  .sidebar.collapsed{width:auto}
  .main{min-height:70vh}
}

.settingsList{display:grid;gap:10px}.settingsCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}.settingsCard h4{margin:0 0 5px}.settingsCard p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.airportResults{display:grid;gap:6px;margin-top:8px;max-height:250px;overflow:auto}.airportResult{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px;text-align:left}.airportResult:hover{background:#f8fafc}.airportResult b{display:block}.airportResult small{color:var(--muted)}
.selectedAirport{margin-top:8px;background:#ecfdf3;color:#027a48;border-radius:10px;padding:9px;font-size:12px;font-weight:800}
.yearMonth{cursor:pointer;transition:.15s}.yearMonth:hover{border-color:#c5cad3}.yearMonth.open{grid-column:1/-1}.yearLayer{margin-top:9px;border-top:1px solid #eef0f3;padding-top:8px}.yearDay{border:1px solid #eef0f3;border-radius:10px;margin:6px 0;overflow:hidden}.yearDayHead{padding:9px 10px;background:#fafbfc;font-size:12px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}.yearItems{padding:7px}.countBadge{font-size:10px;background:#eef2f7;border-radius:999px;padding:4px 7px;color:#475467}
@media(max-width:900px){.app.plannerHidden{grid-template-columns:1fr}}

/* V8 polish */
:root{
  --flight:#e8f1ff;--flightInk:#2458a6;
  --hotel:#ecfdf3;--hotelInk:#087a55;
  --activity:#fff6df;--activityInk:#9a6300;
  --restaurant:#fff0f0;--restaurantInk:#a53a3a;
  --transport:#f0edff;--transportInk:#6549b8;
  --other:#f2f4f7;--otherInk:#475467;
}
.main{padding:20px}
.topbar{align-items:center;margin-bottom:12px}
.controls{align-items:center}
.roundControl{width:38px;height:38px;padding:0!important;display:grid;place-items:center;font-size:20px;line-height:1}
.dateContext{height:38px;min-width:92px;padding:0 13px;border:1px solid var(--line);background:#f8fafc;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:850;color:#344054;white-space:nowrap}
.filterBar{display:flex;gap:7px;align-items:center;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.filterBar::-webkit-scrollbar{display:none}
.filterChip{border:1px solid var(--line);background:#fff;color:#667085;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.filterChip.active{background:#111827;color:#fff;border-color:#111827}
.filterChip.off{opacity:.45;background:#f8fafc}
.filterDivider{height:24px;width:1px;background:var(--line);flex:0 0 auto}
.dayCell{position:relative;overflow:hidden}
.dayCell.selected{box-shadow:inset 0 0 0 2px #111827}
.dayHeader{cursor:pointer}
.event{transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.event:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,24,40,.06)}
.event.type-flight{background:var(--flight);border-color:#d7e6ff}
.event.type-hotel{background:var(--hotel);border-color:#d5f5e5}
.event.type-activity{background:var(--activity);border-color:#fae8b0}
.event.type-restaurant{background:var(--restaurant);border-color:#f6d6d6}
.event.type-transport{background:var(--transport);border-color:#e1dcfb}
.event.type-other{background:var(--other)}
.spanEvent{padding:6px 8px;min-height:34px}
.spanEvent .eventTime{display:flex;justify-content:space-between;gap:5px}
.spanEvent .eventTitle{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.spanEvent .eventMeta{display:none}
.stage{font-size:9px;border-radius:999px;padding:2px 5px;background:rgba(255,255,255,.75);white-space:nowrap}
.attachmentBox{margin-top:12px;border:1px dashed #cfd4dc;background:#fafbfc;border-radius:14px;padding:12px}
.attachmentBox input[type=file]{padding:8px;background:#fff}
.attachmentPreview{margin-top:10px;display:flex;gap:10px;align-items:center}
.attachmentPreview img{width:66px;height:66px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.attachmentPreview .fileInfo{font-size:11px;color:var(--muted);min-width:0}
.attachmentPreview .fileInfo b{display:block;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detailAttachment{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#f8fafc}
.detailAttachment img{display:block;width:100%;max-height:340px;object-fit:contain;background:#fff;cursor:zoom-in}
.modalCard.imageViewer{width:min(860px,100%);background:#0b0f16}
.modalCard.imageViewer img{display:block;max-width:100%;max-height:76vh;margin:auto;object-fit:contain}
.imageViewer .modalClose{position:sticky;top:0;float:right;z-index:2}
@media(max-width:900px){
  .main{padding:14px}
  .topbar{align-items:flex-start}
  .controls{width:100%}
  .dateContext{min-width:82px}
}


.cloudCard{border:1px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.cloudHead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cloudBrand{display:flex;align-items:center;gap:10px}.cloudIcon{width:34px;height:34px;border-radius:10px;background:#f2f4f7;display:grid;place-items:center;font-size:18px}
.cloudState{font-size:11px;font-weight:850;border-radius:999px;padding:5px 8px;background:#f2f4f7;color:#667085}
.cloudState.on{background:#ecfdf3;color:#027a48}.cloudState.warn{background:#fff6df;color:#9a6300}
.cloudMeta{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.45}
.cloudActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.syncToast{position:fixed;right:18px;bottom:18px;z-index:100;background:#101828;color:#fff;border-radius:12px;padding:10px 13px;font-size:12px;font-weight:750;box-shadow:0 10px 30px rgba(16,24,40,.25);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}
.syncToast.show{opacity:1;transform:translateY(0)}

/* V10 — dedicated mobile app layout */
.mobileNav,.mobileShade,.mobileSheetTop{display:none}

@media(max-width:600px){
  html,body{height:100%;overflow:hidden;background:#fff}
  body{padding:0}
  .app{
    display:block;
    min-height:100dvh;
    padding:0;
    background:#fff;
  }
  .main{
    position:fixed;
    inset:0 0 72px 0;
    min-height:0;
    border:0;
    border-radius:0;
    box-shadow:none;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    overflow:hidden;
    background:#fff;
  }
  .topbar{
    display:block;
    margin:0 0 8px;
  }
  .titleWrap{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
  }
  .titleWrap h2{
    font-size:21px;
    line-height:1.15;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .titleWrap p{display:none}
  .controls{
    width:100%;
    display:grid;
    grid-template-columns:1fr;
    gap:8px;
  }
  .segment{
    width:100%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    border-radius:14px;
    padding:3px;
  }
  .segment button{
    min-width:0;
    padding:9px 3px;
    font-size:0;
  }
  .segment button::first-letter{font-size:16px}
  #v-day::after{content:"Day";font-size:10px;display:block;margin-top:2px}
  #v-week::after{content:"Week";font-size:10px;display:block;margin-top:2px}
  #v-month::after{content:"Month";font-size:10px;display:block;margin-top:2px}
  #v-year::after{content:"Year";font-size:10px;display:block;margin-top:2px}
  .navrow{
    display:grid;
    grid-template-columns:38px 1fr 38px;
    width:100%;
    align-items:center;
  }
  .navrow .roundControl:first-child,
  .navrow .roundControl:last-child{display:none}
  .navrow button:nth-of-type(2){grid-column:1}
  .dateContext{grid-column:2;min-width:0;width:100%;height:38px}
  .navrow button:nth-of-type(3){grid-column:3}
  .filterBar{
    margin:0 -12px;
    padding:2px 12px 10px;
  }
  .filterChip{padding:7px 10px}
  .calendarScroller{
    max-height:none;
    height:calc(100% - 126px);
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    padding:0 0 18px;
  }
  .calendar{min-width:0!important;width:100%}
  .dayCell{
    min-height:150px;
    border-radius:16px;
    padding:12px;
  }
  .dayCell.expanded{min-height:240px}
  .event{
    padding:10px;
    border-radius:12px;
    margin-bottom:8px;
  }
  .eventTitle{font-size:13px}
  .eventTime,.eventMeta{font-size:11px}
  .yearGrid{min-width:0;grid-template-columns:1fr}
  .yearMonth.open{grid-column:auto}
  .modal{
    align-items:end;
    padding:0;
    background:rgba(16,24,40,.42);
  }
  .modalCard{
    width:100%;
    max-height:88dvh;
    border-radius:22px 22px 0 0;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }
  .detailGrid{grid-template-columns:1fr 1fr}

  /* Planner becomes a full-height slide-up app sheet */
  .sidebar{
    display:flex;
    position:fixed;
    z-index:80;
    left:0;right:0;bottom:0;
    top:6dvh;
    min-height:0;
    padding:14px 16px calc(22px + env(safe-area-inset-bottom));
    border:0;
    border-radius:24px 24px 0 0;
    box-shadow:0 -18px 60px rgba(16,24,40,.18);
    transform:translateY(110%);
    transition:transform .24s ease;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:#fff;
  }
  .sidebar.mobileOpen{transform:translateY(0)}
  .sidebar.collapsed{padding:14px 16px calc(22px + env(safe-area-inset-bottom));overflow:auto}
  .sidebar.collapsed .hideWhenCollapsed{display:block}
  .sidebar.collapsed .collapseText{display:inline}
  .brandrow,.sidebarToggle{display:none}
  .mobileSheetTop{
    display:flex;
    align-items:center;
    justify-content:center;
    position:sticky;
    top:-14px;
    z-index:5;
    background:#fff;
    margin:-14px -16px 8px;
    padding:9px 16px 6px;
  }
  .mobileSheetHandle{
    width:38px;height:5px;border-radius:999px;background:#d0d5dd
  }
  .mobileSheetClose{
    position:absolute;right:14px;top:7px;
    width:34px;height:34px;border:0;border-radius:50%;
    background:#f2f4f7;color:#344054;font-weight:900
  }
  #planner{padding-bottom:14px}
  #planner h1{font-size:26px}
  .typeGrid{grid-template-columns:1fr 1fr;gap:9px}
  .typeCard{min-height:98px;padding:14px}
  .row{grid-template-columns:1fr}
  input,select,textarea{font-size:16px}
  .actions{
    position:sticky;
    bottom:calc(-22px - env(safe-area-inset-bottom));
    z-index:4;
    margin:20px -16px -22px;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(255,255,255,.96);
    border-top:1px solid var(--line);
    backdrop-filter:blur(12px)
  }
  .airportResults{max-height:34dvh}
  .mobileShade{
    display:block;
    position:fixed;
    inset:0;
    z-index:70;
    background:rgba(16,24,40,.32);
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .mobileShade.open{opacity:1;pointer-events:auto}

  /* fixed iPhone-style navigation */
  .mobileNav{
    display:grid;
    grid-template-columns:1fr 1fr 1.12fr 1fr;
    position:fixed;
    z-index:65;
    left:0;right:0;bottom:0;
    height:calc(68px + env(safe-area-inset-bottom));
    padding:6px 8px env(safe-area-inset-bottom);
    border-top:1px solid #e7eaf0;
    background:rgba(255,255,255,.94);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
  }
  .mobileNavBtn{
    border:0;background:transparent;color:#667085;
    border-radius:14px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:10px;font-weight:800;
  }
  .mobileNavBtn .mIcon{font-size:19px;line-height:1}
  .mobileNavBtn.active{color:#101828}
  .mobileNavBtn.add{
    color:#fff;background:#101828;
    margin:2px 7px;
    border-radius:17px;
    box-shadow:0 7px 18px rgba(16,24,40,.18);
  }
  .mobileNavBtn.add .mIcon{font-size:22px}
  .syncToast{
    left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));
    text-align:center
  }
}

@media(max-width:380px){
  .main{padding-left:10px;padding-right:10px}
  .filterBar{margin-left:-10px;margin-right:-10px;padding-left:10px;padding-right:10px}
  .typeCard{padding:12px}
}


/* V11 — Trips, timeline, import, maps and Wonder Checks */
.tripPill{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
  border-radius:999px;background:#fff;padding:7px 10px;font-size:12px;font-weight:850;
  color:#344054;cursor:pointer;max-width:220px
}
.tripPill span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desktopProductNav{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.productTab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:#667085;cursor:pointer}
.productTab.active{background:#101828;color:#fff;border-color:#101828}
.tripGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.tripCard{border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;text-align:left;cursor:pointer}

  grid-template-columns:minmax(240px,1fr) auto!important;
  align-items:center!important;
  gap:18px!important;
  margin-bottom:10px!important;
}
.titleWrap h2{
  margin:0!important;
  font-size:28px!important;
  line-height:1.08!important;
  letter-spacing:-.025em;
  white-space:normal!important;
}
.titleWrap p{
  margin:5px 0 0!important;
  color:var(--wp-muted)!important;
  font-size:12px!important;
}
.calendarNav{
  justify-self:end;
  display:flex;
  align-items:center;
  gap:6px!important;
  margin:0!important;
}
.roundControl{
  width:40px!important;
  height:40px!important;
  min-width:40px!important;
  border-radius:11px!important;
  border:1px solid var(--wp-border)!important;
  background:#fff!important;
  box-shadow:none!important;
}
.roundControl:hover{background:var(--wp-soft)!important}
.dateContext{
  min-width:112px!important;
  height:40px;
  display:grid;
  place-items:center;
  padding:0 14px!important;
  border:1px solid var(--wp-border)!important;
  border-radius:11px!important;
  background:#fff!important;
  font-size:12px!important;
  font-weight:850!important;
}

.desktopProductNav{
  gap:6px!important;
  margin-bottom:10px!important;
}
.productTab{
  padding:7px 12px!important;
  font-size:11px!important;
  border-radius:999px!important;
  font-weight:800!important;
}

/* Cleaner category chips */
.filterBar{
  gap:6px!important;
  padding-bottom:9px!important;
}
.filterChip,.chip{
  border-radius:999px!important;
}

/* Calendar cards */
.dayCell{
  border-color:#e6eaf0!important;
  border-radius:14px!important;
  box-shadow:none!important;
  background:#fff!important;
}
.dayHeader{
  padding-bottom:9px!important;
  border-bottom:1px solid #eef1f5!important;
  align-items:center!important;
}
.dayName{letter-spacing:.035em}
.dayCell.quickAddTarget:hover{background:#fcfdff!important}

/* Quick add should feel integrated, not like a separate blue control */
.quickAddBtn{
  width:25px!important;
  height:25px!important;
  border:1px solid #dfe8f6!important;
  border-radius:8px!important;
  background:#f7faff!important;
  color:#4b7fba!important;
  font-size:15px!important;
  font-weight:700!important;
  box-shadow:none!important;
  transition:.15s ease;
}
.quickAddBtn:hover{
  background:#edf5ff!important;
  border-color:#cadcf2!important;
  color:#1769c8!important;
}
.dayCell .empty{
  color:#a0a9b8!important;
  font-size:10px!important;
}

/* Event cards slightly quieter */
.event{
  border-radius:11px!important;
  box-shadow:none!important;
}
.costPill{
  font-size:9px!important;
  padding:2px 6px!important;
}

/* Home page control alignment */
.tripHomeTop,.tripHomeSectionHead{align-items:center!important}
.homeSettings,.tripCardMenu{
  display:grid!important;
  place-items:center!important;
  line-height:1!important;
}
.tripCardMenu{
  width:32px!important;
  height:32px!important;
  padding:0!important;
  margin-left:auto!important;
}
.homeNewTrip{
  width:auto!important;
  min-width:124px!important;
  max-width:max-content!important;
  margin-left:auto!important;
}

/* Money screen */
.moneyTop{gap:10px!important}
.moneyCard{border-radius:16px!important}
.moneyCard strong{font-size:24px!important}
.moneyList{border-radius:16px!important}

/* Mobile nav — hard reset so every tab is visually identical */
@media(max-width:600px){
  .mobileNav{
    grid-template-columns:repeat(5,minmax(0,1fr))!important;
    height:calc(66px + env(safe-area-inset-bottom))!important;
    padding:5px 6px env(safe-area-inset-bottom)!important;
  }
  .mobileNavBtn,
  .mobileNavBtn span,
  .mobileNavBtn small{
    font-family:inherit!important;
    font-size:10px!important;
    font-weight:800!important;
    line-height:1.05!important;
    letter-spacing:0!important;
    text-transform:none!important;
  }
  .mobileNavBtn{
    min-width:0!important;
    width:100%!important;
    padding:4px 2px!important;
    gap:4px!important;
    border-radius:12px!important;
  }
  .mobileNavBtn .mIcon{
    font-family:inherit!important;
    font-size:18px!important;
    font-weight:700!important;
    line-height:1!important;
    width:auto!important;
    height:auto!important;
  }
  #m-money .mIcon{font-size:18px!important;font-weight:700!important}
  #m-money span:last-child{font-size:10px!important;font-weight:800!important}
  .mobileNavBtn.add{
    margin:2px 5px!important;
    border-radius:15px!important;
  }
  .mobileNavBtn.add .mIcon{font-size:21px!important}
  .tripUtilityRow{
    display:block!important;
    margin-bottom:8px!important;
  }
  .tripIdentity{margin-bottom:8px}
  .viewSegment{
    min-width:0!important;
    width:100%!important;
    max-width:none!important;
  }
  .viewSegment button{
    font-size:10px!important;
    min-height:38px!important;
    padding:7px 3px!important;
    gap:3px!important;
  }
  .viewIcon{font-size:12px!important}
  .topbar{
    display:block!important;
    margin-bottom:8px!important;
  }
  .titleWrap h2{font-size:26px!important}
  .calendarNav{
    margin-top:9px!important;
    justify-content:flex-start!important;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .calendarNav::-webkit-scrollbar{display:none}
  .roundControl{width:38px!important;height:38px!important;min-width:38px!important}
  .dateContext{height:38px!important;min-width:105px!important}
  .moneyTop{grid-template-columns:1fr!important}
  .moneyCard.primary{grid-column:auto!important}
}

/* Tablet: keep controls clear and intentionally placed */
@media(min-width:601px) and (max-width:1180px){
  .sidebar:not(.collapsed){width:238px!important;min-width:238px!important}
  .tripUtilityRow{
    grid-template-columns:minmax(180px,1fr) auto!important;
    gap:10px!important;
  }
  .viewSegment{min-width:355px!important}
  .viewSegment button{padding:7px 9px!important;font-size:11px!important}
  .topbar{
    grid-template-columns:minmax(180px,1fr) auto!important;
    gap:10px!important;
  }
  .titleWrap h2{font-size:25px!important}
  .titleWrap p{font-size:10px!important}
  .calendarNav{gap:5px!important}
  .roundControl{width:38px!important;height:38px!important;min-width:38px!important}
  .dateContext{height:38px!important;min-width:102px!important}
  .sidebar:not(.collapsed) .typeGrid{gap:6px!important}
  .sidebar:not(.collapsed) .typeCard{min-height:88px!important;padding:9px!important}
  .sidebar:not(.collapsed) .importMainCard{padding:10px!important}
}

}


/* V11.8 — mobile date navigation, compact month and stable section pages */
.sectionView{width:100%;min-width:0}
.calendarScroller.sectionPage{
  overflow-x:hidden!important;
  scroll-behavior:auto!important;
}
.mobileDateNavigator{display:none}

@media(max-width:600px){
  /* Itinerary date navigator */
  .mobileDateNavigator{
    display:block;
    margin:2px 0 12px;
    padding:10px;
    border:1px solid #e5e9f0;
    background:#fff;
    border-radius:16px;
  }
  .mobileDateNavTop{
    display:grid;
    grid-template-columns:38px minmax(0,1fr) 38px;
    gap:7px;
    align-items:center;
  }
  .mobileDateArrow{
    width:38px;height:38px;border-radius:11px;border:1px solid #e2e7ee;
    background:#fff;color:#172033;font-size:21px;font-weight:800;
  }
  .mobileDatePickWrap{
    position:relative;height:42px;border:1px solid #dfe5ee;border-radius:12px;
    background:#f8fafc;overflow:hidden;
  }
  .mobileDatePickLabel{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    gap:7px;font-size:12px;font-weight:900;color:#172033;pointer-events:none;
  }
  .mobileDatePicker{
    position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
  }
  .mobileDateStrip{
    display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:8px;
  }
  .mobileDateChip{
    border:0;border-radius:11px;background:#f6f8fb;padding:7px 2px;
    color:#667085;min-width:0;
  }
  .mobileDateChip b{display:block;font-size:13px;line-height:1;color:#172033}
  .mobileDateChip span{display:block;font-size:8px;font-weight:800;text-transform:uppercase;margin-top:4px}
  .mobileDateChip small{display:block;font-size:8px;margin-top:2px}
  .mobileDateChip.active{background:#eaf3ff;color:#176bc6;box-shadow:inset 0 0 0 1px #d5e7fb}
  .mobileDateChip.active b{color:#176bc6}

  /* Mobile itinerary */
  .timeline.mobileDayTimeline{padding-bottom:90px}
  .mobileTimelineTitle{
    margin:2px 0 8px;font-size:12px;color:#667085;font-weight:750;
  }
  .mobileTimelineEmpty{
    min-height:190px;border:1px dashed #dfe5ee;border-radius:16px;
    display:grid;place-items:center;text-align:center;padding:25px;color:#98a2b3;
    background:#fbfcfe;font-size:12px;
  }
  .mobileTimelineEmpty button{
    margin-top:10px;border:0;border-radius:10px;background:#111827;color:#fff;
    padding:9px 13px;font-weight:850
  }
  .timeline.mobileDayTimeline .wonderPanel{display:none}
  .timeline.mobileDayTimeline .timelineDay{margin-top:0}
  .timeline.mobileDayTimeline .timelineDayHead{
    font-size:15px;padding:3px 1px 10px;margin:0;
  }

  /* True phone-sized month grid — no horizontal zoom/scroll needed */
  .calendarScroller.mobileMonthScroller{overflow-x:hidden!important}
  #calendar.mobileMonthGrid{
    display:grid!important;
    grid-template-columns:repeat(7,minmax(0,1fr))!important;
    gap:4px!important;
    width:100%!important;
    min-width:0!important;
  }
  .mobileMonthWeekday{
    text-align:center;font-size:8px;font-weight:900;color:#98a2b3;
    text-transform:uppercase;padding:3px 0 2px;
  }
  .mobileMonthCell{
    position:relative;min-width:0;height:66px;padding:6px 4px;
    border:1px solid #e8ebf0;border-radius:10px;background:#fff;overflow:hidden;
  }
  .mobileMonthCell.faded{opacity:.36}
  .mobileMonthCell.selected{border-color:#8ab7ec;box-shadow:inset 0 0 0 1px #8ab7ec}
  .mobileMonthTop{display:flex;align-items:center;justify-content:space-between;gap:2px}
  .mobileMonthNum{font-size:11px;font-weight:900;color:#172033}
  .mobileMonthPlus{
    width:20px;height:20px;border:0;border-radius:7px;background:#f2f7fd;color:#4e82bb;
    display:grid;place-items:center;font-size:13px;line-height:1;padding:0
  }
  .mobileMonthDots{display:flex;gap:2px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .mobileMonthDot{width:5px;height:5px;border-radius:999px;background:#667085}
  .mobileMonthDot.flight{background:#84a8d8}
  .mobileMonthDot.hotel{background:#85c9a5}
  .mobileMonthDot.activity{background:#d5a0b0}
  .mobileMonthDot.restaurant{background:#b5a791}
  .mobileMonthDot.transport{background:#8fb6c9}
  .mobileMonthCount{font-size:8px;color:#98a2b3;font-weight:800;margin-top:4px}
  .mobileMonthHint{
    grid-column:1/-1;font-size:9px;color:#98a2b3;text-align:center;padding:4px 0 0
  }

  /* Keep date/title information explicit on phones */
  .titleWrap p{display:none!important}
  .calendarNav .dateContext{
    min-width:126px!important;font-size:11px!important;
  }
}

/* Tablet/web section pages always start at the left edge and occupy the surface correctly */
@media(min-width:601px){
  #calendar.timeline,
  #calendar.mapList,
  #calendar.moneyView{
    width:100%!important;
    min-width:0!important;
    max-width:none!important;
  }
  .calendarScroller.sectionPage{
    overflow-x:hidden!important;
  }
}


/* V11.9.1 — SAFE brand pass. Visual only; V11.8 layout/functionality retained. */
:root{
  --wp-midnight:#0B2545;
  --wp-ocean:#2563EB;
  --wp-explorer:#10B981;
  --wp-sky:#AFE6D9;
  --wp-sand:#F4D6A0;
  --wp-sunset:#FF7A59;
  --wp-cloud:#F3F4F6;
}
html,body{background:var(--wp-cloud)}
.wpBrand{display:flex!important;align-items:center;gap:2px;color:var(--wp-midnight)!important}
.wpBrandMark{width:28px;height:28px;object-fit:contain;margin-right:6px}
.wpWonder{color:var(--wp-midnight)}
.wpPlan{color:var(--wp-ocean)}
.wpHomeMark{width:52px;height:52px;object-fit:contain;flex:0 0 auto}
.wpTagline{font-size:7px;font-weight:850;letter-spacing:.30em;color:#7B8794;margin-top:5px}
.tripHomeBrand{font-weight:900!important;letter-spacing:-.04em!important}
.kicker{color:var(--wp-explorer)!important}
.btn.primary{background:var(--wp-midnight)!important}
.productTab.active,.filterChip.active{background:var(--wp-midnight)!important;border-color:var(--wp-midnight)!important}
.segment button.active{background:#EAF2FF!important;color:var(--wp-ocean)!important}
.quickAddBtn,.mobileMonthPlus{background:#F2F7FF!important;color:var(--wp-ocean)!important;border-color:#DCE8FB!important}
.dayCell.selected{box-shadow:inset 0 0 0 2px var(--wp-ocean)!important}
.moneyCard.primary{background:linear-gradient(135deg,var(--wp-midnight),#133F70)!important}
.homeNewTrip{background:var(--wp-midnight)!important}
.tripHero{background:linear-gradient(135deg,var(--wp-midnight),var(--wp-ocean))!important}
.mobileNavBtn.add{background:var(--wp-midnight)!important}
@media(max-width:600px){
  .wpHomeMark{width:44px;height:44px}
}


/* V11.10 — date navigation / month cleanup / section stability */
.dateContextButton{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  font:inherit;color:inherit;
}
.dateContextButton:hover{background:#F7FAFD!important;border-color:#D6DFEA!important}
.datePickerCard{max-width:440px}
.datePickerQuickRow{display:flex;gap:7px;margin-top:8px}

.wpBrandIconOnly{justify-content:center!important}
.wpBrandMarkSolo{width:34px!important;height:34px!important;margin:0!important}
.sidebar:not(.collapsed) .wpBrandIconOnly{justify-content:flex-start!important}

.mobileMonthWrap{display:block!important;width:100%!important;min-width:0!important}
.mobileMonthGridInner{
  display:grid!important;
  grid-template-columns:repeat(7,minmax(0,1fr))!important;
  gap:4px!important;
  width:100%!important;
  min-width:0!important;
}
.mobileMonthWrap .mobileDateNavigator{margin-bottom:10px!important}
.mobileMonthWrap .mobileMonthWeekday{min-width:0!important}
.mobileMonthWrap .mobileMonthCell{min-width:0!important}
.mobileMonthWrap .mobileMonthHint{margin-top:6px!important}

@media(max-width:600px){
  #calendar.calendar:has(.mobileDateNavigator){
    display:block!important;
    min-width:0!important;
    width:100%!important;
  }
  #calendar.calendar:has(.mobileDateNavigator)>.dayCell{
    margin-top:8px;
  }
  /* Week view should stack vertically on phone instead of forcing horizontal width */
  #calendar.calendar:has(.mobileDateNavigator)>.dayCell{
    width:100%!important;
  }
  .calendarScroller{overflow-x:hidden!important}
}

/* Stable non-calendar sections */
#calendar.timeline.sectionView,
#calendar.mapList.sectionView,
#calendar.moneyView.sectionView{
  display:block!important;
  width:100%!important;
  min-width:0!important;
  grid-template-columns:none!important;
}
.calendarScroller.sectionPage{overflow-x:hidden!important}

function loadState(){
  try{
    const raw=localStorage.getItem("wonderPlanV6");
    if(raw){
      const parsed=JSON.parse(raw);
      if(!parsed.modifiedAt)parsed.modifiedAt=new Date(0).toISOString();
      return parsed;
    }
  }catch(e){}
  return {items:[],trips:[],activeTripId:null,modifiedAt:new Date(0).toISOString()};
}

function tripId(){return "trip_"+Date.now()+"_"+Math.random().toString(36).slice(2)}
function migrateTrips(){
  if(!Array.isArray(state.trips))state.trips=[];
  if(!state.trips.length){
    const existing=Array.isArray(state.items)?state.items:[];
    let start=existing.map(x=>x.date).filter(Boolean).sort()[0]||"";
    let end=existing.map(x=>itemEndDateSafe(x)).filter(Boolean).sort().slice(-1)[0]||"";
    const t={id:tripId(),name:"My Trip",destination:"",startDate:start,endDate:end,emoji:"✈️",travellers:"",items:existing};
    state.trips=[t];state.activeTripId=t.id;state.items=t.items;
  }else{
    if(!state.activeTripId||!state.trips.some(t=>t.id===state.activeTripId))state.activeTripId=state.trips[0].id;
    const t=state.trips.find(t=>t.id===state.activeTripId);
    if(!Array.isArray(t.items))t.items=[];
    state.items=t.items;
  }
}
function itemEndDateSafe(i){return (i?.type==="hotel"&&i.endDate)||(i?.type==="flight"&&i.arrivalDate)||i?.date||""}
function activeTrip(){return state.trips.find(t=>t.id===state.activeTripId)||state.trips[0]}
function syncActiveTrip(){
  const t=activeTrip();if(t)t.items=state.items;
}

function destinationPhoto(t){
  if(t?.coverImage)return {url:t.coverImage,credit:"",link:""};
  const primary=((t?.destination||"")+" "+(t?.name||"")).toLowerCase().replace(/\s+/g,"");
  const aliases=[
    ["vietnam","vietnam"],["hanoi","vietnam"],["danang","vietnam"],["hoian","vietnam"],["hochiminh","vietnam"],
    ["japan","japan"],["tokyo","japan"],["kyoto","japan"],["osaka","japan"],["myoko","japan"],
    ["thailand","thailand"],["bangkok","thailand"],["phuket","thailand"],["chiangmai","thailand"],["koh","thailand"],
    ["bali","indonesia"],["indonesia","indonesia"],
    ["italy","italy"],["rome","italy"],["france","france"],["paris","france"],
    ["australia","australia"],["brisbane","australia"],["sydney","australia"],["goldcoast","australia"],
    ["newzealand","newzealand"],["queenstown","newzealand"]
  ];
  for(const [needle,key] of aliases)if(primary.includes(needle))return DESTINATION_PHOTOS[key];

  // If name/destination gives no clue, inspect current itinerary locations as a secondary hint.
  const itemText=(t?.items||[]).map(i=>`${i.title||""} ${i.location||""}`).join(" ").toLowerCase().replace(/\s+/g,"");
  for(const [needle,key] of aliases)if(itemText.includes(needle))return DESTINATION_PHOTOS[key];

  return {
    url:"https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=1600&q=80",
    credit:"Unsplash",
    link:"https://unsplash.com/"
  };
}
function photoStyle(p){return p?.url?`background-image:url('${p.url.replace(/'/g,"%27")}')`:""}

function tripArt(t){
  const s=((t?.destination||"")+" "+(t?.name||"")).toLowerCase();
  if(/japan|tokyo|kyoto|osaka|myoko|ski/.test(s))return /ski|myoko/.test(s)?"🏔️":"⛩️";
  if(/thailand|phuket|bangkok|island|bali|indonesia/.test(s))return "🏝️";
  if(/europe|italy|france|uk|london/.test(s))return "🏛️";
  return t?.emoji||"✈️";
}
function tripCounts(t){
  const items=t?.items||[];
  return {
    flights:items.filter(i=>i.type==="flight").length,
    stays:items.filter(i=>i.type==="hotel").length,
    plans:items.length
  }
}

  }else{
    syncActiveTrip();
    const t={id:tripId(),...obj,items:[]};state.trips.push(t);state.activeTripId=t.id;state.items=t.items;

}

function persist(msg="✓ Saved locally",touch=true){
  syncActiveTrip();
  if(touch)state.modifiedAt=new Date().toISOString();
  try{
    localStorage.setItem("wonderPlanV6",JSON.stringify(state));
    setStatus(msg);
    if(touch&&cloudConnected&&googleAccessToken)scheduleCloudSave();

function handleAttachment(input){
  const file=input.files?.[0]; if(!file)return;
  if(!file.type.startsWith("image/")){alert("Please choose an image or screenshot.");return}
  const reader=new FileReader();
  reader.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height,max=1500;
      if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      let data;
      try{data=c.toDataURL("image/jpeg",0.86)}catch(e){data=reader.result}
      if(data.length>1900000){alert("That image is too large to store locally. Try a cropped screenshot.");return}
      flow.draft.attachment={name:file.name,type:"image/jpeg",data};
      renderPlanner();
    };
    img.src=reader.result;
  };
  reader.readAsDataURL(file);
}

function finishItem(){
  capture();

  if(!d.date){alert("Please add a date.");return}
  let item={...d,id:flow.editingId||uid()};
  if(d.type==="flight"){
    item.title=`Flight ${String(d.departAirport||"").split(" ")[0]||""} → ${String(d.arriveAirport||"").split(" ")[0]||""}`;
    item.location=`${d.departAirport||d.departCity||""} → ${d.arriveAirport||d.arriveCity||""}`;
    item.meta=[d.airline,d.flightNo,d.arrivalDate?`Arrive ${d.arrivalDate} ${d.arrivalTime||""}`:"",d.bookingRef?`Ref ${d.bookingRef}`:""].filter(Boolean).join(" · ");
  }else{
    item.meta=[d.bookingRef?`Ref ${d.bookingRef}`:"",d.notes||""].filter(Boolean).join(" · ");
  }
  if(flow.editingId){
    const idx=state.items.findIndex(x=>x.id===flow.editingId);
    if(idx>=0)state.items[idx]=item;
  }else state.items.push(item);
  focusDate=new Date(item.date+"T12:00:00");
  persist();
  flow={mode:"home",step:0,draft:{},editingId:null};
  renderAll();
  if(isMobile())closeMobilePlanner();
  closeEditSheet();

function normaliseBookingDate(text){
  if(!text)return "";
  let m=text.match(/\b(20\d{2})[-\/](\d{1,2})[-\/](\d{1,2})\b/);
  if(m)return `${m[1]}-${String(m[2]).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  m=text.match(/\b(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\b/);
  if(m)return `${m[3]}-${String(m[2]).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  m=text.match(/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)?[a-z]*[,]?\s*(\d{1,2})\s+([A-Za-z]{3,9})\s+(20\d{2})\b/i);
  if(m){
    const months={jan:1,january:1,feb:2,february:2,mar:3,march:3,apr:4,april:4,may:5,jun:6,june:6,jul:7,july:7,aug:8,august:8,sep:9,september:9,oct:10,october:10,nov:11,november:11,dec:12,december:12};
    const mo=months[m[2].toLowerCase()];if(mo)return `${m[3]}-${String(mo).padStart(2,"0")}-${String(m[1]).padStart(2,"0")}`;
  }
  return "";
}
function parseBooking(){
  const text=(document.getElementById("importText")?.value||"").trim();
  if(!text){alert("Paste the booking confirmation text first.");return}
  const flight=(text.match(/\b([A-Z]{2})\s?(\d{2,4}[A-Z]?)\b/)||[]);
  const ref=(text.match(/(?:booking|confirmation|reservation|reference|ref|confirmation number)[\s:#-]*([A-Z0-9-]{5,14})/i)||[])[1]||"";
  const iatas=[...text.toUpperCase().matchAll(/\b[A-Z]{3}\b/g)].map(x=>x[0]).filter(x=>WORLD_AIRPORTS.some(a=>a.iata===x));
  const dateCandidates=[
    ...(text.match(/\b20\d{2}[-\/]\d{1,2}[-\/]\d{1,2}\b/g)||[]),
    ...(text.match(/\b\d{1,2}[\/.-]\d{1,2}[\/.-]20\d{2}\b/g)||[]),
    ...(text.match(/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*[,]?\s+\d{1,2}\s+[A-Za-z]{3,9}\s+20\d{2}\b/gi)||[])
  ];
  const dates=[...new Set(dateCandidates.map(normaliseBookingDate).filter(Boolean))];
  const looksFlight=!!flight.length||iatas.length>=2;
  const looksHotel=/booking\.com|hotel|check[- ]?in|check[- ]?out|accommodation|room|property/i.test(text);
  const guess=looksFlight?"flight":looksHotel?"hotel":"other";

  let property="";
  if(looksHotel){
    const lines=text.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    property=lines.find(l=>l.length>3&&l.length<80&&!/booking|confirmation|check.?in|check.?out|guest|reference|reservation|date|room/i.test(l))||"Imported stay";
  }
  const title=looksFlight?`Flight ${iatas[0]||""}${iatas[1]?` → ${iatas[1]}`:""}`:(property||"Imported booking");
  document.getElementById("modalCard").innerHTML=`
    <div class="modalTop"><div><div class="kicker">I found this</div><h3>${esc(title)}</h3></div><button class="modalClose" onclick="closeModal()">✕</button></div>
    <div class="importResult"><h4>${guess==="flight"?"✈️ Flight":guess==="hotel"?"🏨 Stay":"＋ Booking"}</h4>
      <p class="sub">
        ${property&&guess==="hotel"?`Property: ${esc(property)}<br>`:""}
        ${flight[0]?`Flight: ${esc(flight[0].replace(/\s+/g,""))}<br>`:""}
        ${iatas.length?`Airports: ${esc(iatas.slice(0,2).join(" → "))}<br>`:""}
        ${dates.length?`Dates: ${esc(dates.slice(0,2).join(" → "))}<br>`:""}
        ${ref?`Reference: ${esc(ref)}`:""}
      </p>
    </div>
    <div class="helperNote">Review the extracted information before adding it. You can correct anything Wonder Plan didn't identify.</div>
    <div class="actions"><button class="btn secondary" onclick="openImportBooking()">Back</button><button class="btn primary" onclick="acceptImportedBooking('${guess}','${esc((flight[0]||"").replace(/\s+/g,""))}','${esc(iatas[0]||"")}','${esc(iatas[1]||"")}','${esc(dates[0]||"")}','${esc(dates[1]||"")}','${esc(ref)}','${esc(property)}')">Review & add</button></div>`;
}
function acceptImportedBooking(type,flightNo,from,to,date,endDate,ref,property=""){
  closeModal();
  if(type==="flight"){
    const fa=WORLD_AIRPORTS.find(a=>a.iata===from),ta=WORLD_AIRPORTS.find(a=>a.iata===to);
    flow={mode:"flight",step:2,editingId:null,draft:{type:"flight",flightNo,date,departAirport:fa?`${fa.iata} — ${fa.name}`:from,arriveAirport:ta?`${ta.iata} — ${ta.name}`:to,bookingRef:ref,arrivalDate:endDate||date}};
  }else{
    flow={mode:type,step:1,editingId:null,draft:{type,title:type==="hotel"?(property||"Imported stay"):"Imported booking",date,endDate:type==="hotel"?endDate:"",bookingRef:ref}};
  }
  renderPlanner();if(isMobile())openMobilePlanner();
}

function timelineOccurrenceDates(i){
  if(!i?.date)return [];
  const start=new Date(i.date+"T12:00:00");
  const end=new Date(itemEndDate(i)+"T12:00:00");
  if(isNaN(start)||isNaN(end))return [i.date];
  const out=[];
  for(let d=new Date(start);d<=end;d=addDays(d,1)){
    const ds=iso(d);
    if(isItemOnDate(i,ds))out.push(ds);
  }
  return out.length?out:[i.date];
}
function timelineItemsForDate(ds){
  return state.items.filter(i=>isItemOnDate(i,ds)).sort((a,b)=>{
    const ta=(a.type==="flight"&&occurrenceStage(a,ds)==="Arrives"?(a.arrivalTime||"99:99"):(a.time||"99:99"));
    const tb=(b.type==="flight"&&occurrenceStage(b,ds)==="Arrives"?(b.arrivalTime||"99:99"):(b.time||"99:99"));
    return ta.localeCompare(tb)||sortItems(a,b);
  });
}

function movePeriod(dir){

  if(view==="day")focusDate=addDays(focusDate,dir);
  if(view==="week")focusDate=addDays(focusDate,dir*7);
  if(view==="month")focusDate=new Date(focusDate.getFullYear(),focusDate.getMonth()+dir,1,12);

function dateContextLabel(d){
  const today=new Date();today.setHours(12,0,0,0);
  const x=new Date(d);x.setHours(12,0,0,0);
  const diff=Math.round((x-today)/86400000);
  if(diff===0)return "Today";
  if(diff===1)return "Tomorrow";
  if(diff===-1)return "Yesterday";
  return x.toLocaleDateString(undefined,{day:"numeric",month:"short"});
}
function setFocusDate(ds,rerender=true){focusDate=new Date(ds+"T12:00:00");if(rerender)renderCalendar()}
function itemEndDate(i){
  if(i.type==="hotel"&&i.endDate)return i.endDate;
  if(i.type==="flight"&&i.arrivalDate)return i.arrivalDate;
  return i.date;
}
function isItemOnDate(i,ds){
  if(!typeFilters[i.type])return false;
  if(i.type==="hotel"&&i.endDate)return ds>=i.date&&ds<=i.endDate;
  if(i.type==="flight"&&i.arrivalDate&&i.arrivalDate!==i.date)return ds===i.date||ds===i.arrivalDate;
  return ds===i.date;
}
function itemsForDate(ds){return state.items.filter(i=>isItemOnDate(i,ds)).sort(sortItems)}
function occurrenceStage(i,ds){
  if(i.type==="hotel"&&i.endDate&&i.endDate!==i.date){
    if(ds===i.date)return "Check-in";
    if(ds===i.endDate)return "Check-out";
    return "Stay";
  }
  if(i.type==="flight"&&i.arrivalDate&&i.arrivalDate!==i.date){
    return ds===i.date?"Departs":"Arrives";
  }
  return "";
}
function eventHTML(i,compact=false,ds=i.date){
  const stage=occurrenceStage(i,ds);
  const spanning=!!stage;
  let when=i.time||TYPES[i.type]?.label||"Plan";
  if(i.type==="flight"&&stage==="Arrives")when=i.arrivalTime||"Arrival";
  return `<div class="event type-${i.type} ${compact?"compact":""} ${spanning?"spanEvent":""}" onclick="event.stopPropagation();openItem('${i.id}')">
    <div class="eventTime"><span>${TYPES[i.type]?.icon||"•"} ${esc(when)}</span>${stage?`<span class="stage">${stage}</span>`:""}</div>
    <div class="eventTitle">${esc(i.title)}</div>
    ${!spanning&&i.location?`<div class="eventMeta">${esc(i.location)}</div>`:""}
    ${!spanning&&i.meta?`<div class="eventMeta">${esc(i.meta)}</div>`:""}
    ${showCosts&&Number(i.price)>0?`<span class="costPill">${formatMoney(Number(i.price),i.currency||moneyDisplayCurrency)}</span>`:""}
  </div>`;
}
function renderFilters(){
  const bar=document.getElementById("filterBar");if(!bar)return;
  const active=Object.values(typeFilters).filter(Boolean).length;
  bar.innerHTML=`<button class="filterChip ${active===6?"active":""}" onclick="showAllTypes()">✦ All</button><span class="filterDivider"></span>`+
    Object.entries(TYPES).map(([k,v])=>`<button class="filterChip ${typeFilters[k]?"active":"off"}" onclick="toggleType('${k}')">${v.icon} ${v.label}</button>`).join("");
}
function toggleType(t){typeFilters[t]=!typeFilters[t];renderCalendar()}
function showAllTypes(){const allOn=Object.values(typeFilters).every(Boolean);Object.keys(typeFilters).forEach(k=>typeFilters[k]=!allOn);renderCalendar()}

function renderCalendar(){
  updateTripUI();
  renderFilters();
  document.getElementById("dateContext").textContent=isMobile()
    ? focusDate.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"})
    : dateContextLabel(focusDate);
  ["day","week","month","year"].forEach(v=>document.getElementById("v-"+v).classList.toggle("active",v===view));
  const cal=document.getElementById("calendar"),focusIso=iso(focusDate);
  if(view==="day"){
    document.querySelector(".calendarScroller")?.classList.remove("mobileMonthScroller");
    cal.className="calendar";cal.style.gridTemplateColumns="1fr";
    const ds=focusIso,items=itemsForDate(ds);
    document.getElementById("calendarTitle").textContent=focusDate.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    cal.innerHTML=dayCellHTML(focusDate,items,false);
    return;
  }
  if(view==="week"){
    document.querySelector(".calendarScroller")?.classList.remove("mobileMonthScroller");
    const start=startOfWeek(focusDate);
    cal.className="calendar";cal.style.gridTemplateColumns="repeat(7,minmax(135px,1fr))";
    document.getElementById("calendarTitle").textContent=`Week of ${start.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"})}`;
    let h="";for(let n=0;n<7;n++){const d=addDays(start,n),ds=iso(d),items=itemsForDate(ds);h+=dayCellHTML(d,items,false)}
    cal.innerHTML=h;return;
  }
  if(view==="month"){
    const y=focusDate.getFullYear(),m=focusDate.getMonth(),first=new Date(y,m,1,12),start=startOfWeek(first);
    document.getElementById("calendarTitle").textContent=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});

    if(isMobile()){
      const scroller=document.querySelector(".calendarScroller");
      scroller?.classList.add("mobileMonthScroller");
      cal.className="mobileMonthWrap";
      cal.style.gridTemplateColumns="";
      let cells="";
      for(let n=0;n<42;n++){
        const d=addDays(start,n),ds=iso(d),items=itemsForDate(ds);
        const dots=items.slice(0,4).map(i=>`<span class="mobileMonthDot ${i.type}"></span>`).join("");
        cells+=`<div class="mobileMonthCell ${d.getMonth()!==m?"faded":""} ${ds===focusIso?"selected":""}" onclick="focusDate=new Date('${ds}T12:00:00');view='day';renderCalendar()">
          <div class="mobileMonthTop"><span class="mobileMonthNum">${d.getDate()}</span><button class="mobileMonthPlus" onclick="event.stopPropagation();calendarAdd('${ds}')" title="Add plan">＋</button></div>
          <div class="mobileMonthDots">${dots}</div>
          ${items.length?`<div class="mobileMonthCount">${items.length}</div>`:""}
        </div>`;
      }
      cal.innerHTML=`${mobileDateNavigatorHTML("calendar")}
        <div class="mobileMonthGridInner">
          ${["M","T","W","T","F","S","S"].map(x=>`<div class="mobileMonthWeekday">${x}</div>`).join("")}
          ${cells}
        </div>
        <div class="mobileMonthHint">Tap a date to open the day · tap + to add a plan</div>`;
      return;
    }

    document.querySelector(".calendarScroller")?.classList.remove("mobileMonthScroller");
    cal.className="calendar";cal.style.gridTemplateColumns="repeat(7,minmax(120px,1fr))";
    let h="";
    for(let n=0;n<42;n++){
      const d=addDays(start,n),ds=iso(d),items=itemsForDate(ds),expanded=expandedMonthDate===ds;
      h+=`<div class="dayCell ${d.getMonth()!==m?"faded":""} ${expanded?"expanded":""} ${ds===focusIso?"selected":""}" onclick="toggleMonthDay('${ds}')">
        <div class="dayHeader"><div class="dayName">${d.toLocaleDateString(undefined,{weekday:"short"})}</div><div class="dayNum">${d.getDate()}</div><button class="quickAddBtn" onclick="event.stopPropagation();calendarAdd('${ds}')" title="Add plan">＋</button></div>
        ${items.length?(expanded?items.map(i=>eventHTML(i,false,ds)).join(""):items.slice(0,4).map(i=>eventHTML(i,true,ds)).join("")):`<div class="empty">Open</div>`}
        ${!expanded&&items.length>4?`<div class="eventMeta">+${items.length-4} more</div>`:""}
      </div>`;
    }
    cal.innerHTML=h;return;
  }
  document.querySelector(".calendarScroller")?.classList.remove("mobileMonthScroller");
  document.getElementById("calendarTitle").textContent=String(focusDate.getFullYear());
  cal.className="yearGrid";cal.style.gridTemplateColumns="";
  let h="";
  for(let m=0;m<12;m++){
    const monthItems=state.items.filter(i=>{
      if(!typeFilters[i.type])return false;
      const start=new Date(i.date+"T12:00:00"),end=new Date(itemEndDate(i)+"T12:00:00");
      const monthStart=new Date(focusDate.getFullYear(),m,1,12),monthEnd=new Date(focusDate.getFullYear(),m+1,0,12);
      return start<=monthEnd&&end>=monthStart;
    }).sort(sortItems);
    const open=expandedYearMonth===m, groups={};
    if(open){
      const days=new Date(focusDate.getFullYear(),m+1,0).getDate();
      for(let day=1;day<=days;day++){
        const ds=iso(new Date(focusDate.getFullYear(),m,day,12)),its=itemsForDate(ds);
        if(its.length)groups[ds]=its;
      }
    }
    h+=`<div class="yearMonth ${open?"open":""}" onclick="toggleYearMonth(event,${m})">
      <h3>${open?"▾":"▸"} ${new Date(focusDate.getFullYear(),m,1).toLocaleDateString(undefined,{month:"long"})} <span class="countBadge">${monthItems.length}</span></h3>
      ${!open?(monthItems.length?monthItems.slice(0,3).map(i=>eventHTML(i,true,i.date)).join(""):`<div class="empty">No plans</div>`):`
      <div class="yearLayer">${Object.entries(groups).map(([date,items])=>`<div class="yearDay">
        <div class="yearDayHead" onclick="event.stopPropagation();toggleYearDay('${date}')"><span>${expandedYearDay===date?"▾":"▸"} ${new Date(date+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}</span><span style="display:flex;align-items:center;gap:7px">${items.length} item${items.length===1?"":"s"}<button class="quickAddBtn" onclick="event.stopPropagation();calendarAdd('${date}')" title="Add plan">＋</button></span></div>
        ${expandedYearDay===date?`<div class="yearItems">${items.map(i=>eventHTML(i,false,date)).join("")}</div>`:""}
      </div>`).join("")||`<div class="empty">No plans</div>`}</div>`}
    </div>`;
  }
  cal.innerHTML=h;
}
function sortItems(a,b){return (a.date+(a.time||"99:99")).localeCompare(b.date+(b.time||"99:99"))}
function dayCellHTML(d,items){
  const ds=iso(d),selected=ds===iso(focusDate);
  return `<div class="dayCell expanded quickAddTarget ${selected?"selected":""}" onclick="calendarCellTap(event,'${ds}')">
    <div class="dayHeader">
      <div class="dayName">${d.toLocaleDateString(undefined,{weekday:"long"})}</div>
      <div class="dayNum">${d.getDate()}</div>
      <button class="quickAddBtn" onclick="event.stopPropagation();calendarAdd('${ds}')" title="Add plan on this date">＋</button>
    </div>
    ${items.length?items.map(i=>eventHTML(i,false,ds)).join(""):`<div class="empty">Tap here to add a plan</div>`}
  </div>`
}
function toggleMonthDay(ds){focusDate=new Date(ds+"T12:00:00");expandedMonthDate=expandedMonthDate===ds?null:ds;renderCalendar()}
function toggleYearMonth(e,m){if(e.target.closest(".event"))return;expandedYearMonth=expandedYearMonth===m?null:m;expandedYearDay=null;renderCalendar()}
function toggleYearDay(date){focusDate=new Date(date+"T12:00:00");expandedYearDay=expandedYearDay===date?null:date;renderCalendar()}
function cloudStatusHTML(){
  const remembered=localStorage.getItem("wonderPlanCloudConnected")==="1";
  const stateClass=cloudConnected?"on":(remembered&&cloudReconnectNeeded?"warn":"");
  const stateText=cloudConnected?"Connected":(remembered&&cloudReconnectNeeded?"Reconnect":"Not connected");
  return `<div class="cloudCard">
    <div class="cloudHead">
      <div class="cloudBrand"><div class="cloudIcon">☁️</div><div><h4 style="margin:0">Google Drive Sync</h4><div class="cloudMeta">Sync the same trip between your iPad and iPhone.</div></div></div>
      <span class="cloudState ${stateClass}">${stateText}</span>
    </div>
    <div class="cloudMeta">${cloudConnected
      ? (cloudEmail?`Connected as ${esc(cloudEmail)}<br>`:"")+`Last synced: ${cloudLastSync||"Not yet"}`
      : remembered&&cloudReconnectNeeded
        ? `Wonder Plan remembers this Drive connection, but Google needs a quick sign-in refresh.`
        : `Your trip stays local until you connect Google Drive.`}</div>
    <div class="cloudActions">
      ${cloudConnected
        ? `<button class="btn secondary" onclick="manualCloudSync()">↻ Sync now</button><button class="btn secondary" onclick="disconnectGoogleDrive()">Disconnect</button>`
        : remembered&&cloudReconnectNeeded
          ? `<button class="btn" onclick="connectGoogleDrive(false)">Reconnect Google Drive</button><button class="btn secondary" onclick="disconnectGoogleDrive()">Forget connection</button>`
          : `<button class="btn" onclick="connectGoogleDrive()">Connect Google Drive</button>`}
    </div>
  </div>`;
}

function formatMoney(value,currency=moneyDisplayCurrency){
  try{return new Intl.NumberFormat(undefined,{style:"currency",currency,maximumFractionDigits:currency==="JPY"||currency==="KRW"||currency==="VND"||currency==="IDR"?0:2}).format(value)}
  catch(e){return `${currency} ${Number(value||0).toFixed(2)}`}
}
async function refreshFxRates(silent=false){
  const currencies=[...new Set(state.items.filter(i=>Number(i.price)>0).map(i=>i.currency||moneyDisplayCurrency).concat([moneyDisplayCurrency]))];
  fxRates={[moneyDisplayCurrency]:1};
  try{
    await Promise.all(currencies.filter(c=>c!==moneyDisplayCurrency).map(async c=>{
      const r=await fetch(`https://api.frankfurter.dev/v2/rate/${encodeURIComponent(c.toLowerCase())}/${encodeURIComponent(moneyDisplayCurrency.toLowerCase())}`);
      if(!r.ok)throw new Error("rate");
      const d=await r.json();fxRates[c]=Number(d.rate)||0;fxUpdated=d.date||"";
    }));
    localStorage.setItem("wonderPlanFxRates",JSON.stringify({base:moneyDisplayCurrency,rates:fxRates,date:fxUpdated,time:Date.now()}));
    if(!silent)toastSync(`Exchange rates updated${fxUpdated?` · ${fxUpdated}`:""}`);
  }catch(e){
    const saved=JSON.parse(localStorage.getItem("wonderPlanFxRates")||"null");
    if(saved?.base===moneyDisplayCurrency){fxRates=saved.rates||{};fxUpdated=saved.date||""}
    if(!silent)toastSync("Couldn't refresh rates — using cached rates where available");
  }
  if(appSection==="money")renderMoney();
  else if(appSection==="calendar")renderCalendar();
}
function convertedPrice(i){
  const p=Number(i.price)||0,c=i.currency||moneyDisplayCurrency;
  if(!p)return 0;
  if(c===moneyDisplayCurrency)return p;
  return fxRates[c]?p*fxRates[c]:null;
}
function setMoneyCurrency(c){
  moneyDisplayCurrency=c;localStorage.setItem("wonderPlanMoneyCurrency",c);refreshFxRates(true);renderMoney();
}
function toggleCosts(){
  showCosts=!showCosts;localStorage.setItem("wonderPlanShowCosts",showCosts?"1":"0");
  if(appSection==="money")renderMoney();else renderCalendar();
}
function renderMoney(){
  updateTripUI();
  const cal=document.getElementById("calendar"),t=activeTrip();
  document.getElementById("calendarTitle").textContent="Trip money";
  document.getElementById("dateContext").textContent=t?.name||"Money";
  cal.className="moneyView sectionView";
  const priced=state.items.filter(i=>Number(i.price)>0);
  const converted=priced.map(i=>({i,v:convertedPrice(i)}));
  const known=converted.filter(x=>x.v!==null);
  const total=known.reduce((s,x)=>s+x.v,0);
  const byType={};
  known.forEach(({i,v})=>byType[i.type]=(byType[i.type]||0)+v);
  const currencies=[...new Set(priced.map(i=>i.currency||moneyDisplayCurrency))];
  cal.innerHTML=`<div class="moneyToolbar">
    <div class="left"><label class="moneyToggle"><input type="checkbox" ${showCosts?"checked":""} onchange="toggleCosts()"> Show prices on itinerary</label></div>
    <div style="display:flex;gap:7px;align-items:center"><select style="width:auto;padding:9px 12px" onchange="setMoneyCurrency(this.value)">${CURRENCIES.map(c=>`<option value="${c}" ${c===moneyDisplayCurrency?"selected":""}>Show total in ${c}</option>`).join("")}</select><button class="btn secondary" onclick="refreshFxRates()">↻ Rates</button></div>
  </div>
  <div class="moneyTop">
    <div class="moneyCard primary"><small>Estimated trip total</small><strong>${formatMoney(total,moneyDisplayCurrency)}</strong><div class="fxNote">${priced.length} priced item${priced.length===1?"":"s"}${fxUpdated?` · rates ${fxUpdated}`:""}</div></div>
    <div class="moneyCard"><small>Original currencies</small><strong>${currencies.length}</strong></div>
    <div class="moneyCard"><small>Items without price</small><strong>${state.items.length-priced.length}</strong></div>
  </div>
  <div class="moneyBreakdown">
    <div class="moneyList"><h3>Breakdown</h3>${Object.keys(byType).length?Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([type,v])=>`<div class="moneyItem"><div><b>${TYPES[type]?.icon||"•"} ${TYPES[type]?.label||type}</b><span>${state.items.filter(i=>i.type===type&&Number(i.price)>0).length} priced item(s)</span></div><div class="amount">${formatMoney(v,moneyDisplayCurrency)}</div></div>`).join(""):`<div class="moneyEmpty">Add prices to your flights, stays and activities to build a trip budget.</div>`}</div>
    <div class="moneyList"><h3>All priced items</h3>${priced.length?priced.sort(sortItems).map(i=>{const cv=convertedPrice(i);return `<div class="moneyItem"><div><b>${TYPES[i.type]?.icon||"•"} ${esc(i.title)}</b><span>${esc(i.date||"")} · ${esc(i.currency||moneyDisplayCurrency)}</span></div><div class="amount">${formatMoney(Number(i.price),i.currency||moneyDisplayCurrency)}${cv!==null&&(i.currency||moneyDisplayCurrency)!==moneyDisplayCurrency?`<small>≈ ${formatMoney(cv,moneyDisplayCurrency)}</small>`:""}</div></div>`}).join(""):`<div class="moneyEmpty">No prices added yet.</div>`}</div>
  </div>
  ${converted.some(x=>x.v===null)?`<div class="fxNote">Some totals are excluded because an exchange rate is unavailable. Tap “Rates” when online.</div>`:""}`;
  if(priced.some(i=>(i.currency||moneyDisplayCurrency)!==moneyDisplayCurrency)&&Object.keys(fxRates).length<=1)refreshFxRates(true);
}

function openSettings(){
  if(isMobile())setMobileNavActive("m-settings");
  document.getElementById("modalCard").className="modalCard";
  document.getElementById("modalCard").innerHTML=`
    <div class="modalTop"><div><div class="kicker">Wonder Plan</div><h3>Settings</h3></div><button class="modalClose" onclick="closeModal()">✕</button></div>
    <div class="settingsList" style="margin-top:16px">
      ${cloudStatusHTML()}
      <div class="settingsCard"><h4>Automatic saving</h4><p>Your itinerary is saved locally on this device automatically. Cloud sync is an extra copy for your other devices.</p></div>
      <div class="settingsCard"><h4>Backup & restore</h4><p>Export a portable backup or restore one from another device.</p>
        <div class="actions"><button class="btn secondary" onclick="exportTrip()">⬇ Export backup</button><button class="btn secondary" onclick="document.getElementById('settingsFile').click()">⬆ Import backup</button></div>
        <input id="settingsFile" type="file" accept=".json,application/json" style="display:none" onchange="importTrip(event)">
      </div>
      <div class="settingsCard"><h4>Trip sharing</h4><p>Share a lightweight trip summary using the iPhone/iPad share sheet.</p><button class="btn secondary" onclick="shareCurrentTrip()">↗ Share current trip</button></div>
      <div class="settingsCard importBeta"><h4>Booking import</h4><p>Eventually you'll be able to paste a Booking.com, airline or hotel confirmation and have the stay/flight populated automatically. The current text parser is experimental.</p><button class="btn secondary" onclick="openImportBooking()">Try booking import beta</button></div>
      <div class="settingsCard"><h4>Smart services</h4><p>Wonder Checks work locally. Live flight status, terminal data, route travel times, screenshot OCR and email import require external data/API connections; the V11 interface is ready for those connections without exposing secret API keys in the public GitHub app.</p></div>
      <div class="settingsCard"><h4>Calendar layers</h4><p>Use the category switches above the calendar to show or hide flights, stays, activities, meals and transport without deleting anything.</p></div>
    </div>`;
  document.getElementById("modal").classList.add("open");
}

function toastSync(message){
  const el=document.getElementById("syncToast");if(!el)return;
  el.textContent=message;el.classList.add("show");
  clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove("show"),2600);
}
function formatSyncTime(){return new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}
function initGoogleTokenClient(){
  if(!window.google?.accounts?.oauth2)return false;
  if(googleTokenClient)return true;
  googleTokenClient=google.accounts.oauth2.initTokenClient({
    client_id:GOOGLE_CLIENT_ID,
    scope:DRIVE_SCOPE,
    callback:async(resp)=>{
      if(resp.error){
        googleAccessToken="";
        cloudConnected=false;
        cloudReconnectNeeded=localStorage.getItem("wonderPlanCloudConnected")==="1";
try{
  const savedFx=JSON.parse(localStorage.getItem("wonderPlanFxRates")||"null");
  if(savedFx?.base===moneyDisplayCurrency){fxRates=savedFx.rates||{};fxUpdated=savedFx.date||""}
}catch(e){}
        if(!window.__wpSilentAuth)toastSync("Google connection needs refreshing");
        if(document.getElementById("modal")?.classList.contains("open"))openSettings();
        return;
      }
      googleAccessToken=resp.access_token||"";
      cloudConnected=!!googleAccessToken;
      cloudReconnectNeeded=false;
      if(cloudConnected){
        localStorage.setItem("wonderPlanCloudConnected","1");
        await resolveCloudOnConnect();
        if(document.getElementById("modal")?.classList.contains("open"))openSettings();
      }
    }
  });
  return true;
}
function connectGoogleDrive(firstConnect=true){
  window.__wpSilentAuth=false;
  if(!initGoogleTokenClient()){toastSync("Google is still loading — try again in a moment");return}
  googleTokenClient.requestAccessToken({prompt:firstConnect?"consent":""});
}
function restoreGoogleDriveConnection(){
  if(localStorage.getItem("wonderPlanCloudConnected")!=="1")return;
  cloudReconnectNeeded=true;
  let attempts=0;
  const timer=setInterval(()=>{
    attempts++;
    if(initGoogleTokenClient()){
      clearInterval(timer);
      window.__wpSilentAuth=true;
      try{googleTokenClient.requestAccessToken({prompt:""});}
      catch(e){cloudReconnectNeeded=true;}
      setTimeout(()=>{window.__wpSilentAuth=false},3000);
    }else if(attempts>=30){
      clearInterval(timer);
      cloudReconnectNeeded=true;
    }
  },200);
}
async function disconnectGoogleDrive(){
  if(googleAccessToken&&window.google?.accounts?.oauth2){
    try{google.accounts.oauth2.revoke(googleAccessToken,()=>{})}catch(e){}
  }
  googleAccessToken="";cloudConnected=false;cloudReconnectNeeded=false;cloudFileId=null;cloudEmail="";cloudLastSync="";
  localStorage.removeItem("wonderPlanCloudConnected");
  toastSync("Google Drive disconnected");
  openSettings();
}
async function driveFetch(url,options={}){
  if(!googleAccessToken)throw new Error("Not connected");
  const headers=new Headers(options.headers||{});
  headers.set("Authorization","Bearer "+googleAccessToken);
  const response=await fetch(url,{...options,headers});
  if(response.status===401){
    googleAccessToken="";
    cloudConnected=false;
    cloudReconnectNeeded=localStorage.getItem("wonderPlanCloudConnected")==="1";
try{
  const savedFx=JSON.parse(localStorage.getItem("wonderPlanFxRates")||"null");
  if(savedFx?.base===moneyDisplayCurrency){fxRates=savedFx.rates||{};fxUpdated=savedFx.date||""}
}catch(e){}
    throw new Error("Google session expired");
  }
  if(!response.ok)throw new Error(await response.text()||("Drive error "+response.status));
  return response;
}
async function findCloudFile(){
  const q=encodeURIComponent(`name='${CLOUD_FILE_NAME}' and trashed=false`);
  const r=await driveFetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name,modifiedTime)&pageSize=10`);
  const j=await r.json();
  cloudFileId=j.files?.[0]?.id||null;
  return cloudFileId;
}
async function downloadCloudState(){
  if(!cloudFileId)return null;
  const r=await driveFetch(`https://www.googleapis.com/drive/v3/files/${cloudFileId}?alt=media`);
  return await r.json();
}
function cloudPayload(){
  return {app:"Wonder Plan",version:"11.10",modifiedAt:state.modifiedAt||new Date().toISOString(),state};
}
async function createCloudFile(){
  const boundary="wp_"+Math.random().toString(36).slice(2);
  const metadata=JSON.stringify({name:CLOUD_FILE_NAME,parents:["appDataFolder"]});
  const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${metadata}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(cloudPayload())}\r\n--${boundary}--`;
  const r=await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id",{
    method:"POST",headers:{"Content-Type":"multipart/related; boundary="+boundary},body
  });
  const j=await r.json();cloudFileId=j.id;
}
async function uploadCloudState(){
  if(!cloudFileId){await createCloudFile()}
  else{
    await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${cloudFileId}?uploadType=media`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify(cloudPayload())
    });
  }
  cloudLastSync=formatSyncTime();
  localStorage.setItem("wonderPlanCloudLastSync",cloudLastSync);
  toastSync("✓ Synced to Google Drive");
}
async function resolveCloudOnConnect(){
  try{
    await findCloudFile();
    if(!cloudFileId){
      await uploadCloudState();
      return;
    }
    const cloud=await downloadCloudState();
    const cloudState=cloud?.state||cloud;
    const cloudTime=new Date(cloud?.modifiedAt||cloudState?.modifiedAt||0).getTime();
    const localTime=new Date(state.modifiedAt||0).getTime();
    if(cloudTime>localTime){
      const useCloud=confirm("A newer Wonder Plan trip was found in Google Drive. Load that version on this device?");
      if(useCloud){
        state=cloudState;
        if(!state.modifiedAt)state.modifiedAt=cloud?.modifiedAt||new Date().toISOString();
        persist("✓ Loaded from Google Drive",false);
        focusDate=state.items.length?new Date(state.items[0].date+"T12:00:00"):new Date();
        renderPlanner();renderCalendar();
        cloudLastSync=formatSyncTime();toastSync("✓ Cloud trip loaded");
      }else{
        await uploadCloudState();
      }
    }else if(localTime>cloudTime){
      await uploadCloudState();
    }else{
      cloudLastSync=formatSyncTime();toastSync("✓ Google Drive connected");
    }
  }catch(e){
    console.error(e);
    toastSync(e.message==="Google session expired"?"Google session expired — reconnect":"Cloud sync failed");
  }
}
function scheduleCloudSave(){
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer=setTimeout(()=>uploadCloudState().catch(e=>{console.error(e);toastSync("Cloud sync paused")}),1200);
}
async function manualCloudSync(){
  try{
    await findCloudFile();
    if(!cloudFileId){await uploadCloudState();openSettings();return}
    const cloud=await downloadCloudState(),cloudState=cloud?.state||cloud;
    const cloudTime=new Date(cloud?.modifiedAt||cloudState?.modifiedAt||0).getTime();
    const localTime=new Date(state.modifiedAt||0).getTime();
    if(cloudTime>localTime){
      const useCloud=confirm("Google Drive has a newer copy. Replace this device's copy with the cloud version?");
      if(useCloud){
        state=cloudState;persist("✓ Loaded from cloud",false);renderPlanner();renderCalendar();toastSync("✓ Cloud trip loaded");
      }else await uploadCloudState();
    }else await uploadCloudState();
    cloudLastSync=formatSyncTime();openSettings();
  }catch(e){console.error(e);toastSync("Sync failed — reconnect Google Drive if needed")}
}
function exportTrip(){
  const payload={app:"Wonder Plan",version:"11.10",savedAt:new Date().toISOString(),data:state};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="wonder-plan-trip.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  setStatus("💾 Trip file saved");
}
function importTrip(e){
  const file=e.target.files?.[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const parsed=JSON.parse(r.result),incoming=parsed.data||parsed;
      if(!incoming||!Array.isArray(incoming.items))throw new Error("Invalid Wonder Plan file");
      state=incoming;persist("✓ Trip loaded");
      if(state.items.length)focusDate=new Date(state.items[0].date+"T12:00:00");
      renderAll();
    }catch(err){alert("Could not load this trip: "+err.message)}
    e.target.value="";
  };
  r.readAsText(file);
}
function renderAll(){
  renderPlanner();updateTripUI();
  if(document.getElementById("tripHome")&&!document.getElementById("tripHome").classList.contains("hidden"))renderTripHome();
  if(appSection==="timeline")renderTimeline();
  else if(appSection==="map")renderMap();
  else if(appSection==="money")renderMoney();
  else renderCalendar();
}
cloudLastSync=localStorage.getItem("wonderPlanCloudLastSync")||"";
cloudReconnectNeeded=localStorage.getItem("wonderPlanCloudConnected")==="1";
try{
  const savedFx=JSON.parse(localStorage.getItem("wonderPlanFxRates")||"null");
  if(savedFx?.base===moneyDisplayCurrency){fxRates=savedFx.rates||{};fxUpdated=savedFx.date||""}
}catch(e){}
renderAll();
showSection(appSection);
renderTripHome();
document.getElementById("tripHome")?.classList.remove("hidden");
restoreGoogleDriveConnection();
</script>
